name: Deploy VS Code Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PythOnline
        uses: actions/checkout@v4

      - name: Checkout VS Code
        uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          path: vscode
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: vscode/.nvmrc
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Get VS Code commit
        run: echo "VSCODE_SHA=$(git -C vscode rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Cache VS Code dependencies
        id: vscode-deps-cache
        uses: actions/cache@v4
        with:
          path: vscode/node_modules
          key: vscode-node-${{ env.VSCODE_SHA }}-${{ hashFiles('vscode/package-lock.json') }}

      - name: Install native build dependencies
        if: steps.vscode-deps-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev pkg-config

      - name: Install VS Code dependencies
        if: steps.vscode-deps-cache.outputs.cache-hit != 'true'
        working-directory: vscode
        run: |
          # GitHub Actions runners occasionally reset long npm downloads.
          # Make npm retry transient registry/network failures instead of
          # failing the whole VS Code build on the first ECONNRESET.
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000

          for attempt in 1 2 3; do
            echo "npm ci attempt $attempt/3"
            if npm ci --no-audit --no-fund --prefer-offline; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm ci failed; retrying after a short delay..."
              sleep 10
            fi
          done

          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Prepare VS Code generated assets
        working-directory: vscode
        run: |
          # codicon.ttf is intentionally gitignored by VS Code and is normally
          # copied from the @vscode/codicons npm package by this build task.
          # The server-web bundler imports codicon.css directly, so ensure the
          # generated font exists before bundling.
          npm run gulp copy-codicons
          test -s src/vs/base/browser/ui/codicons/codicon/codicon.ttf

      - name: Build and package PythOnline
        run: ./site.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
