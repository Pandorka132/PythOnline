name: Deploy VS Code Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PythOnline
        uses: actions/checkout@v4

      - name: Checkout VS Code
        uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          path: vscode
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: vscode/.nvmrc

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev

      - name: Install VS Code dependencies
        working-directory: vscode
        run: npm install --no-audit --no-fund

      - name: Build and package VS Code Web
        working-directory: vscode
        run: npm run gulp vscode-web-min

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -a vscode-web/. site/

          test -f site/out/vs/code/browser/workbench/workbench.html

          cp site/out/vs/code/browser/workbench/workbench.html site/index.html
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
