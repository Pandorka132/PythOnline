name: Deploy VS Code Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PythOnline
        uses: actions/checkout@v4

      - name: Checkout VS Code
        uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          path: vscode
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: vscode/.nvmrc
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Get VS Code commit
        run: echo "VSCODE_SHA=$(git -C vscode rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Cache built VS Code Web
        id: vscode-web-cache
        uses: actions/cache@v4
        with:
          path: |
            vscode-web
            vscode/node_modules
          key: vscode-web-${{ env.VSCODE_SHA }}-node-${{ hashFiles('vscode/package-lock.json') }}

      - name: Install native build dependencies
        if: steps.vscode-web-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev pkg-config

      - name: Install VS Code dependencies
        if: steps.vscode-web-cache.outputs.cache-hit != 'true'
        working-directory: vscode
        run: npm ci --no-audit --no-fund

      - name: Build and package VS Code Web
        if: steps.vscode-web-cache.outputs.cache-hit != 'true'
        working-directory: vscode
        run: npm run gulp vscode-web-min

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -a vscode-web/. site/

          test -f site/out/vs/code/browser/workbench/workbench.html

          python3 - <<'PY'
          from pathlib import Path
          import html
          
          template = Path("site/out/vs/code/browser/workbench/workbench.html")
          index = template.read_text()
          
          replacements = {
              "{{WORKBENCH_WEB_BASE_URL}}": ".",
              "{{WORKBENCH_NLS_FALLBACK_URL}}": "./out/nls.messages.js",
              "{{WORKBENCH_NLS_URL}}": "./out/nls.messages.js",
              "{{WORKBENCH_AUTH_SESSION}}": "",
              "{{WORKBENCH_SCRIPT_NONCE}}": "",
              "{{WORKBENCH_WEB_CONFIGURATION}}": html.escape(
                  '{"productConfiguration":{"enableTelemetry":false},"workspaceUri":{"scheme":"tmp","path":"/default.code-workspace"}}',
                  quote=True,
              ),
          }
          for key, value in replacements.items():
              index = index.replace(key, value)
          
          if "{{" in index:
              raise SystemExit("Unresolved VS Code workbench template placeholders remain")
          
          Path("site/index.html").write_text(index)
          PY
          # The VS Code web package is normally laid out correctly, but its
          # static-server resources use server-side routes. Normalize those paths
          # for GitHub Pages so the browser can load the same files directly.
          mkdir -p site/resources/server

          copy_asset() {
            local target="$1"
            shift
            local found
            found="$(find site \( -type f -o -type l \) "$@" -print -quit)"
            if [ -z "$found" ]; then
              echo "Missing required VS Code web asset: $target"
              exit 1
            fi
            cp -f "$found" "site/$target"
            echo "Normalized $target from $found"
          }

          # Recent VS Code web builds package the main stylesheet as
          # workbench.web.main.css; the generated workbench template expects
          # the stable code/browser/workbench/workbench.css route.
          css_found="$(find site -type f \( \
            -path "*/out/vs/code/browser/workbench/workbench.css" -o \
            -path "*/out/vs/workbench/workbench.web.main*.css" \
          \) -print -quit)"
          if [ -z "$css_found" ]; then
            echo "Missing required VS Code web stylesheet"
            find site -type f -name '*.css' | head -50
            exit 1
          fi
          cp -f "$css_found" "site/out/vs/code/browser/workbench/workbench.css"
          echo "Normalized workbench.css from $css_found"
          copy_asset "out/vs/code/browser/workbench/workbench.js" \
            -path "*/out/vs/code/browser/workbench/workbench.js"
          copy_asset "resources/server/manifest.json" \
            -name "manifest.json"
          copy_asset "resources/server/favicon.ico" \
            -name "favicon.ico"
          copy_asset "resources/server/code-192.png" \
            -name "code-192.png"
          copy_asset "resources/server/code-512.png" \
            -name "code-512.png"

          # Fail the build instead of deploying a broken Pages artifact.
          test -s site/out/vs/code/browser/workbench/workbench.css
          test -s site/out/vs/code/browser/workbench/workbench.js
          test -s site/resources/server/manifest.json

          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
