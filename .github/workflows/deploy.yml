name: Deploy VS Code Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PythOnline
        uses: actions/checkout@v4

      - name: Checkout VS Code
        uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          path: vscode
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: vscode/.nvmrc
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Get VS Code commit
        run: echo "VSCODE_SHA=$(git -C vscode rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Cache built VS Code Web
        id: vscode-web-cache
        uses: actions/cache@v4
        with:
          path: |
            vscode-web
            vscode/node_modules
          key: vscode-web-v3-${{ env.VSCODE_SHA }}-node-${{ hashFiles('vscode/package-lock.json') }}-fs-${{ hashFiles('browser-fs/**') }}

      - name: Install native build dependencies
        if: steps.vscode-web-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev pkg-config

      - name: Install VS Code dependencies
        if: steps.vscode-web-cache.outputs.cache-hit != 'true'
        working-directory: vscode
        run: |
          # GitHub Actions runners occasionally reset long npm downloads.
          # Make npm retry transient registry/network failures instead of
          # failing the whole VS Code build on the first ECONNRESET.
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000

          for attempt in 1 2 3; do
            echo "npm ci attempt $attempt/3"
            if npm ci --no-audit --no-fund --prefer-offline; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm ci failed; retrying after a short delay..."
              sleep 10
            fi
          done

          echo "npm ci failed after 3 attempts"
          exit 1

      - name: Build and package VS Code Web
        if: steps.vscode-web-cache.outputs.cache-hit != 'true'
        working-directory: vscode
        run: |
          # Add the PythOnline browser filesystem as a built-in web extension.
          # VS Code's web build packages every local extension under extensions/.
          rm -rf extensions/pythonline-browser-fs
          mkdir -p extensions/pythonline-browser-fs
          cp ../browser-fs/package.json extensions/pythonline-browser-fs/package.json
          cp ../browser-fs/extension.js extensions/pythonline-browser-fs/extension.js

          # vscode-web-min intentionally uses the "web" build target. That target
          # contains the web workbench but deliberately does NOT emit the browser
          # shell at vs/code/browser/workbench/workbench.js.
          npm run gulp vscode-web-min

          # Build the browser shell with the "server-web" target. We only copy
          # its browser entry assets into the static client package.
          node build/next/index.ts bundle \
            --out out-vscode-web-shell \
            --target server-web \
            --minify \
            --nls

          # Make the cached vscode-web artifact self-contained: the browser shell
          # is produced by server-web, while the rest of the package comes from web.
          mkdir -p vscode-web/out/vs/code/browser/workbench
          cp -f out-vscode-web-shell/vs/code/browser/workbench/workbench.js \
            vscode-web/out/vs/code/browser/workbench/workbench.js
          cp -f out-vscode-web-shell/vs/code/browser/workbench/workbench.css \
            vscode-web/out/vs/code/browser/workbench/workbench.css

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -a vscode-web/. site/

          test -f site/out/vs/code/browser/workbench/workbench.html

          python3 - <<'PY'
          from pathlib import Path
          import html
          
          template = Path("site/out/vs/code/browser/workbench/workbench.html")
          index = template.read_text()
          
          replacements = {
              "{{WORKBENCH_WEB_BASE_URL}}": ".",
              "{{WORKBENCH_NLS_FALLBACK_URL}}": "./out/nls.messages.js",
              "{{WORKBENCH_NLS_URL}}": "./out/nls.messages.js",
              "{{WORKBENCH_AUTH_SESSION}}": "",
              "{{WORKBENCH_SCRIPT_NONCE}}": "",
              "{{WORKBENCH_WEB_CONFIGURATION}}": html.escape(
                  '{"productConfiguration":{"enableTelemetry":false},"workspaceUri":{"scheme":"pythonline","path":"/workspace"}}',
                  quote=True,
              ),
          }
          for key, value in replacements.items():
              index = index.replace(key, value)
          
          if "{{" in index:
              raise SystemExit("Unresolved VS Code workbench template placeholders remain")
          
          Path("site/index.html").write_text(index)
          PY
          # The VS Code web package is normally laid out correctly, but its
          # static-server resources use server-side routes. Normalize those paths
          # for GitHub Pages so the browser can load the same files directly.
          mkdir -p site/resources/server

          copy_asset() {
            local target="$1"
            shift
            local found
            found="$(find site \( -type f -o -type l \) "$@" -print -quit)"
            if [ -z "$found" ]; then
              echo "Missing required VS Code web asset: $target"
              exit 1
            fi
            cp -f "$found" "site/$target"
            echo "Normalized $target from $found"
          }

          # The browser shell was copied into vscode-web during the build step,
          # so it is also present on cache hits.
          copy_asset "resources/server/manifest.json" \
            -name "manifest.json"
          copy_asset "resources/server/favicon.ico" \
            -name "favicon.ico"
          copy_asset "resources/server/code-192.png" \
            -name "code-192.png"
          copy_asset "resources/server/code-512.png" \
            -name "code-512.png"

          # Fail the build instead of deploying a broken Pages artifact.
          test -s site/out/vs/code/browser/workbench/workbench.css
          test -s site/out/vs/code/browser/workbench/workbench.js
          test -s site/resources/server/manifest.json

          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
